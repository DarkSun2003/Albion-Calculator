<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1422"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fceda2"/>
      <stop offset="40%" stop-color="#e5b842"/>
      <stop offset="100%" stop-color="#9a711c"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff2be"/>
      <stop offset="100%" stop-color="#c69b2d"/>
    </linearGradient>
    <linearGradient id="runeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Obsidian Plaque / Crest Shield -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  <rect x="7" y="7" width="50" height="50" rx="10" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 2" fill="none" opacity="0.6" />

  <!-- Master Crafter Anvil Base & Horn -->
  <path d="M16 28 C20 29 25 30 30 30 L48 30 C50 30 51 29 51 27.5 C51 26 49.5 25 47 25 L24 25 C20 25 16 23.5 13 21 C13 23.5 14.5 26.5 16 28 Z" fill="url(#goldGrad)" />
  <path d="M26 30 L28 40 L20 45 L20 48 L44 48 L44 45 L36 40 L38 30 Z" fill="url(#goldGlow)" />
  
  <!-- Forgemaster Sledge Hammer -->
  <g transform="rotate(-30 32 30)">
    <rect x="30" y="10" width="4" height="26" rx="2" fill="#94a3b8" />
    <rect x="25" y="10" width="14" height="8" rx="2" fill="url(#goldGrad)" stroke="#5c4314" stroke-width="0.8" />
  </g>

  <!-- Glowing Runic Spark -->
  <path d="M43 14 L45 19 L50 21 L45 23 L43 28 L41 23 L36 21 L41 19 Z" fill="url(#runeGrad)" />
  <circle cx="43" cy="21" r="1.5" fill="#ffffff" />
</svg>
